name: pages
# Builds the browser page and publishes it on GitHub Pages. No asset is built or hosted: the page extracts the
# visitor's own disk image in the browser. Enable it once: Settings, Pages, Source: GitHub Actions.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - uses: mymindstorm/setup-emsdk@v14
        with: { version: "4.0.9" }
      - run: emcc --version | head -1 && make -j1 web && ls -l build/web build/web/extract
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: build/web }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
